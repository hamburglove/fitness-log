<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>健身打卡</title>
<meta name="description" content="简洁的健身打卡记录：部位、动作、组数次数、卡路里估算、日历与统计">
<meta name="theme-color" content="#F5F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="健身打卡">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#F5F6FA;--card:#FFFFFF;--card2:#F8F9FC;--text:#1C1E26;--sub:#8A8FA3;--line:#ECEEF3;
  --body:#DCE0EA;--accent:#5B6CFF;--accent2:#8B5CF6;--ok:#22B07D;--danger:#F0506E;
  --shadow:0 6px 20px rgba(30,40,90,.06);--r:18px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1115;--card:#1A1D24;--card2:#20242D;--text:#ECEEF3;--sub:#8B90A0;--line:#2A2E38;--body:#363B48;--shadow:0 6px 20px rgba(0,0,0,.35)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 14px) calc(var(--sr) + 16px) calc(var(--sb) + 92px) calc(var(--sl) + 16px)}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 16px}
.top .d1{font-size:28px;font-weight:700;letter-spacing:.5px}
.top .d2{color:var(--sub);font-size:14px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.pill svg{width:18px;height:18px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.sec-h h2{font-size:17px;margin:0;font-weight:700}
.sec-h .hint{color:var(--sub);font-size:13px}
/* summary */
.summary{background:linear-gradient(135deg,#6D7BFF,#9B5CF6);color:#fff;box-shadow:0 10px 26px rgba(109,123,255,.35)}
.summary .row{display:flex;justify-content:space-between;text-align:center}
.summary .n{font-size:24px;font-weight:700;line-height:1.2}
.summary .l{font-size:12px;opacity:.85}
.summary .goal{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);font-size:13px;width:100%;color:#fff;text-align:left}
.summary .goal b{font-size:16px}
.summary .st{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.22);font-size:12px;font-weight:600}
/* parts */
.parts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.part{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent;transition:transform .12s,border-color .15s,background .15s}
.part:active{transform:scale(.95)}
.part svg{width:34px;height:46px}
.part span{font-size:12px;font-weight:600;white-space:nowrap}
.part.sel{border-color:var(--c);background:var(--t)}
/* exercises */
.exs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ex{position:relative;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:transform .12s}
.ex:active{transform:scale(.96)}
.ex .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--t);color:var(--c)}
.ex .ic svg{width:36px;height:36px}
.ex .nm{font-size:13px;font-weight:600;line-height:1.25}
.ex .mt{font-size:11px;color:var(--sub)}
.ex.add{border:2px dashed var(--line);box-shadow:none;background:transparent}
.ex.add .ic{background:var(--card2);color:var(--sub)}
.ex .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--card2);color:var(--sub);font-size:14px;line-height:22px}
/* log */
.grp{margin-bottom:12px}
.grp-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:0 2px 8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.entry{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;margin-bottom:8px}
.entry .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--t);color:var(--c);flex:none}
.entry .ic svg{width:30px;height:30px}
.entry .mid{flex:1;min-width:0}
.entry .t{font-weight:600}
.entry .s{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis}
.entry .nt{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .kc{font-size:13px;font-weight:700;color:#FF8A3D;white-space:nowrap}
.entry .acts{display:flex;gap:4px}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card2);color:var(--sub)}
.ib svg{width:18px;height:18px}
.ib.del:active{color:var(--danger)}
.empty{text-align:center;color:var(--sub);padding:26px 10px;font-size:14px}
.empty svg{width:56px;height:56px;opacity:.5;display:block;margin:0 auto 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:16px;padding:15px;font-weight:700;font-size:16px;background:var(--accent);color:#fff;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.big{padding:18px;font-size:17px;background:linear-gradient(135deg,#6D7BFF,#9B5CF6);box-shadow:0 10px 24px rgba(109,123,255,.35)}
.btn.done{background:linear-gradient(135deg,#22B07D,#3CCB91);box-shadow:0 10px 24px rgba(34,176,125,.3)}
.btn.ghost{background:var(--card2);color:var(--text);font-weight:600}
.btn.danger{background:transparent;color:var(--danger);font-weight:600}
.btn svg{width:22px;height:22px}
.link{display:block;margin:10px auto 0;color:var(--sub);font-size:13px;text-decoration:underline}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px calc(var(--sr) + 8px) calc(var(--sb) + 6px) calc(var(--sl) + 8px)}
@supports not (background:color-mix(in srgb,red,blue)){.tabs{background:var(--card)}}
.tabs .in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--sub);font-size:11px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
/* sheet */
.mask{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;
  padding:10px calc(var(--sr) + 18px) calc(var(--sb) + 18px) calc(var(--sl) + 18px);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet:not(.on){visibility:hidden}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sh-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sh-h .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--t);color:var(--c);flex:none}
.sh-h .ic svg{width:36px;height:36px}
.sh-h .t{font-size:19px;font-weight:700}
.sh-h .s{font-size:13px;color:var(--sub)}
.sh-h .close{margin-left:auto}
.fl{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.fl .lb{font-weight:600}
.fl .lb small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.stp{display:inline-flex;align-items:center;background:var(--card2);border-radius:12px;overflow:hidden}
.stp button{width:38px;height:40px;font-size:20px;color:var(--accent);font-weight:600}
.stp input{width:52px;height:40px;border:0;background:transparent;text-align:center;font-size:17px;font-weight:700;outline:none;-moz-appearance:textfield}
.stp input::-webkit-inner-spin-button,.stp input::-webkit-outer-spin-button,.inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inp{height:40px;-webkit-appearance:none;appearance:none;border:0;border-radius:12px;background:var(--card2);padding:0 10px;font-size:16px;font-weight:600;outline:none;width:100%;text-align:center}
.inp:focus,.stp:focus-within,textarea:focus{box-shadow:0 0 0 2px var(--accent) inset}
.sets-h,.set{display:grid;grid-template-columns:30px 1fr 96px 34px;gap:8px;align-items:center}
.sets-h{font-size:12px;color:var(--sub);padding:4px 0}
.set{padding:5px 0}
.set .idx{width:26px;height:26px;border-radius:50%;background:var(--t);color:var(--c);font-weight:700;font-size:13px;display:grid;place-items:center}
.set .stp{width:100%;justify-content:space-between}
.set .stp input{flex:1;min-width:0}
.addset{width:100%;margin-top:6px;padding:11px;border-radius:12px;border:1.5px dashed var(--line);color:var(--accent);font-weight:600}
textarea{width:100%;border:0;border-radius:12px;background:var(--card2);padding:10px 12px;font-size:16px;resize:none;outline:none;margin-top:12px}
.est{display:flex;align-items:center;justify-content:space-between;background:rgba(255,138,61,.1);color:#E8742A;border-radius:14px;padding:12px 14px;margin:14px 0}
.est b{font-size:20px}
.est small{font-size:11px;opacity:.85}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.field .inp{text-align:left}
/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h .m{font-weight:700;font-size:17px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-g .wd{font-size:12px;color:var(--sub);padding:4px 0}
.day{aspect-ratio:1/1.08;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:600;position:relative;border:2px solid transparent}
.day.out{visibility:hidden}
.day.fut{color:var(--sub);opacity:.5}
.day.today{border-color:var(--line)}
.day.chk{background:var(--t);color:var(--c)}
.day.sel{border-color:var(--accent)}
.day .dots{display:flex;gap:2px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.day .ck{position:absolute;top:2px;right:3px;width:12px;height:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .dot{width:8px;height:8px}
/* stats */
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sc{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 10px;text-align:center}
.sc .n{font-size:24px;font-weight:700;line-height:1.2}
.sc .n small{font-size:12px;font-weight:600;color:var(--sub);margin-left:1px}
.sc .l{font-size:12px;color:var(--sub);margin-top:2px}
.hb{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.hb .nm{width:52px;flex:none;font-weight:600}
.hb .tr{flex:1;height:10px;border-radius:6px;background:var(--card2);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:6px}
.hb .v{width:34px;text-align:right;color:var(--sub)}
.vb{display:flex;align-items:flex-end;justify-content:space-between;height:130px;gap:8px;padding-top:16px}
.vb .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.vb .c i{display:block;width:100%;max-width:28px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#FFAA6B,#FF7A3D);min-height:3px}
.vb .c .v{font-size:10px;color:var(--sub)}
.vb .c .d{font-size:11px;color:var(--sub)}
.hl{display:flex;align-items:center;gap:12px}
.hl svg{width:44px;height:58px;flex:none}
/* settings */
.set-list .it{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:10px}
.set-list .it:last-child{border-bottom:0}
.set-list .it .lb{font-weight:600}
.set-list .it .lb small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.set-list .unit{display:flex;align-items:center;gap:6px;color:var(--sub)}
.set-list .unit .inp{width:84px}
.note{font-size:12.5px;color:var(--sub);line-height:1.6}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 0;border-radius:11px;font-weight:700;color:var(--sub);transition:all .15s}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:0 2px 8px rgba(30,40,90,.1)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--card2);border-radius:12px;padding:10px 6px;text-align:center}
.kv b{display:block;font-size:17px}
.kv span{font-size:11.5px;color:var(--sub)}
.target{text-align:center;padding:4px 0 2px}
.target .big{font-size:42px;font-weight:800;letter-spacing:.5px;line-height:1.1;background:linear-gradient(135deg,#6D7BFF,#9B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent}
.target .big small{font-size:16px;-webkit-text-fill-color:var(--sub);color:var(--sub);font-weight:600;margin-left:4px}
.target .rg{font-size:13px;color:var(--sub);margin-top:4px}
.trn{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,138,61,.1);color:#E8742A;font-size:13.5px;font-weight:600}
.macro{display:flex;align-items:center;gap:16px}
.macro .ring{position:relative;width:132px;height:132px;flex:none}
.macro .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.macro .ring .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.macro .ring .ct b{font-size:22px;line-height:1.1}
.macro .ring .ct span{font-size:11px;color:var(--sub)}
.mlist{flex:1;min-width:0}
.mrow{margin:6px 0 10px}
.mrow .h{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.mrow .h .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.mrow .h .g{font-size:18px;font-weight:800}
.mrow .h .g small{font-size:12px;color:var(--sub);font-weight:600}
.mrow .sub{font-size:12px;color:var(--sub)}
.mrow .bar{height:6px;border-radius:4px;background:var(--card2);margin-top:4px;overflow:hidden}
.mrow .bar i{display:block;height:100%;border-radius:4px}
.tips{list-style:none;margin:0;padding:0}
.tips li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tips li:last-child{border-bottom:0}
.tips .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:16px}
.tips small{display:block;color:var(--sub);font-size:12px}
.foods{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.food{background:var(--card2);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:600}
.food small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.fh{font-size:13px;font-weight:700;margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.disc{font-size:12px;color:var(--sub);text-align:center;margin:16px 8px 4px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translate(-50%,20px);background:rgba(28,30,38,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:480px){.parts{gap:10px}.part svg{width:40px;height:54px}}
</style>
</head>
<body>
<div class="app">
  <!-- 今日 -->
  <section class="view on" id="v-today"></section>
  <!-- 历史 -->
  <section class="view" id="v-diet"></section>
  <section class="view" id="v-history"></section>
  <!-- 统计 -->
  <section class="view" id="v-stats"></section>
  <!-- 我的 -->
  <section class="view" id="v-me"></section>
</div>

<nav class="tabs"><div class="in">
  <button class="tab on" data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12h11"/><rect x="3" y="8" width="3.5" height="8" rx="1"/><rect x="17.5" y="8" width="3.5" height="8" rx="1"/><path d="M1.5 10.5v3M22.5 10.5v3"/></svg>今日</button>
  <button class="tab" data-act="tab" data-tab="diet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 20h8"/><path d="M9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/></svg>饮食</button>
  <button class="tab" data-act="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>历史</button>
  <button class="tab" data-act="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/></svg>统计</button>
  <button class="tab" data-act="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/></svg>我的</button>
</div></nav>

<div class="mask" id="mask" data-act="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ========== 数据定义 ========== */
const PARTS=[
  {id:'chest',name:'胸部',color:'#FF6B6B',view:'front',hl:['chest']},
  {id:'sfront',name:'肩前束',color:'#F5A524',view:'front',hl:['deltF']},
  {id:'sside',name:'肩中束',color:'#E8B400',view:'front',hl:['deltS']},

function nutrition(p){
  const B=bmr(p),T=tdee(p),w=num(p.weight),g=GOALS.some(x=>x[0]===p.goal)?p.goal:'cut';
  let target,lo,hi,note;
  if(g==='cut'){lo=Math.max(B,T-500);hi=Math.max(B,T-300);target=lo;note='约每周减 0.5 kg';}
  else if(g==='bulk'){lo=T+250;hi=T+300;target=lo;note='缓慢增肌，减少多余脂肪';}
  else{lo=hi=target=T;note='保持当前体重';}
  const pPer=g==='cut'?2.0:1.8;
  const pg=Math.round(pPer*w),pk=pg*4;
  const fg=Math.round(Math.max(target*0.25,0.6*w*9)/9),fk=fg*9;
  const cg=Math.max(0,Math.round((target-pk-fk)/4)),ck=cg*4;
  const pct=k=>Math.round(k/target*100);
  return {B,T,w,g,target,lo,hi,note,pPer,
    p:{g:pg,k:pk,pct:pct(pk)},f:{g:fg,k:fk,pct:pct(fk)},c:{g:cg,k:ck,pct:pct(ck)},

}

/* ========== 卡路里估算（MET）========== */
function hours(e){
  if(e.t==='c') return num(e.minutes)/60;
  let sec=0;
  for(const s of e.sets||[]){const r=num(s.r);if(r>0) sec+= e.t==='h'? r+60 : r*3+60;}
  return sec/3600;
}
const kcal=e=>Math.round(num(e.m)*(num(e.bw)||S.profile.weight)*hours(e));
const dayKcal=d=>d?d.entries.reduce((a,e)=>a+kcal(e),0):0;

const dayParts=d=>d?PARTS.filter(p=>d.entries.some(e=>e.part===p.id)):[];

function summary(e){
  if(e.t==='c'){let s=`${num(e.minutes)} 分钟`;if(num(e.km)>0)s+=` · ${num(e.km)} km`;return s}
  const sets=e.sets||[],n=sets.length,unit=e.t==='h'?'秒':'次';
  const rs=sets.map(s=>num(s.r)),ws=sets.map(s=>s.w===''||s.w==null?null:num(s.w));
  let s=rs.every(r=>r===rs[0])?`${n} 组 × ${rs[0]} ${unit}`:`${n} 组 · ${rs.join('/')} ${unit}`;
  const wv=ws.filter(w=>w!=null&&w>0);
  if(wv.length){s+= wv.length===n&&wv.every(w=>w===wv[0])?` · ${wv[0]} kg`:` · 最大 ${Math.max(...wv)} kg`}
  return s;
}

function longest(){
  const ks=Object.keys(S.days).filter(isChecked).sort();let best=0,cur=0,prev=null;
  for(const k of ks){const t=pkey(k).getTime();cur=prev!=null&&Math.round((t-prev)/864e5)===1?cur+1:1;best=Math.max(best,cur);prev=t}
  return best;
}
function rangeKeys(from,to){const out=[];const d=new Date(from);while(d<=to){out.push(dkey(d));d.setDate(d.getDate()+1)}return out}
function weekKeys(){const d=new Date();d.setHours(0,0,0,0);const off=(d.getDay()+6)%7;const s=new Date(d);s.setDate(d.getDate()-off);const e=new Date(s);e.setDate(s.getDate()+6);return rangeKeys(s,e)}
function lastNKeys(n){const e=new Date();e.setHours(0,0,0,0);const s=new Date(e);s.setDate(e.getDate()-n+1);return rangeKeys(s,e)}

}

  const ents=d?d.entries:[],chk=isChecked(k),st=streak();
  let h=`<div class="top"><div><div class="d1">${dt.getMonth()+1}月${dt.getDate()}日</div><div class="d2">星期${WD[dt.getDay()]} · ${dt.getFullYear()}年</div></div>
    <div class="pill" title="连续打卡天数">${UI_IC.flame}${st} 天</div></div>`;
  h+=`<div class="card summary"><div class="st"><span>今日训练</span><span class="badge">${chk?UI_IC.check.replace('<svg','<svg width="14" height="14"')+'已打卡':'未打卡'}</span></div>
    <div class="row"><div><div class="n">${ents.length}</div><div class="l">动作</div></div><div><div class="n">${daySets(d)}</div><div class="l">总组数</div></div>
    <div><div class="n">${dayKcal(d)}</div><div class="l">训练消耗 kcal（估算）</div></div></div>
    <button class="goal" data-act="tab" data-tab="diet" id="today-goal"><span>饮食热量目标（${GOALS.find(x=>x[0]===nutrition(S.profile).g)[1]}）</span><span><b>${nutrition(S.profile).target}</b> kcal · 训练 ${dayKcal(d)} kcal ›</span></button></div>`;
  h+=`<div class="sec"><div class="sec-h"><h2>选择部位</h2><span class="hint">点一下开始记录</span></div><div class="parts">`;
  for(const p of PARTS) h+=`<button class="part${ui.part===p.id?' sel':''}" style="${cv(p)}" data-act="part" data-id="${p.id}" aria-label="${p.name}">${bodySVG(p)}<span>${p.name}</span></button>`;
  h+=`</div></div>`;
  if(ui.part){
    const p=PM[ui.part];
    h+=`<div class="sec" id="exSec"><div class="sec-h"><h2>选择动作 · ${p.name}</h2><span class="hint">${p.id==='cardio'?'记录时长/距离':'记录组数/次数'}</span></div><div class="exs">`;
    exList(p.id).forEach((e,i)=>{
      h+=`<button class="ex" style="${cv(p)}" data-act="ex" data-i="${i}">${e.custom?`<span class="x" data-act="delCustom" data-n="${esc(e.n)}" aria-label="删除自定义动作">×</span>`:''}<div class="ic">${ico(e.i)}</div><div class="nm">${esc(e.n)}</div><div class="mt">${e.custom?'自定义':e.t==='c'?'有氧':e.t==='h'?'计时':'力量'}</div></button>`;
    });
    h+=`<button class="ex add" data-act="addCustom"><div class="ic">${ico('plus')}</div><div class="nm">自定义动作</div><div class="mt">保存可复用</div></button></div></div>`;
  }
  h+=`<div class="sec"><div class="sec-h"><h2>今日记录</h2>${ents.length?`<span class="hint">共 ${ents.length} 个动作</span>`:''}</div>${entriesHTML(ents,true)}</div>`;
  h+=`<div class="sec">`;
  if(chk) h+=`<button class="btn big done" data-act="checkin">${UI_IC.check} 今日已打卡 · 继续保持</button><button class="link" data-act="uncheck">撤销打卡</button>`;
  else h+=`<button class="btn big" data-act="checkin">${UI_IC.check} 完成今日训练 · 打卡</button>`;
  h+=`</div>`;
  $('#v-today').innerHTML=h;
}
function entriesHTML(ents,editable){
  if(!ents.length) return `<div class="card empty">${ico('dumbbell',2)}${editable?'还没有记录，先选一个部位和动作吧':'这天没有训练记录'}</div>`;
  let h='';
  for(const p of PARTS){
    const list=ents.filter(e=>e.part===p.id);if(!list.length)continue;
    h+=`<div class="grp"><div class="grp-h"><span class="dot" style="background:${p.color}"></span>${p.name}<span class="hint" style="color:var(--sub);font-weight:400;font-size:12px">${list.reduce((a,e)=>a+kcal(e),0)} kcal</span></div>`;
    for(const e of list){
      h+=`<div class="entry" style="${cv(p)}"><div class="ic">${ico(e.i)}</div><div class="mid"><div class="t">${esc(e.name)}</div><div class="s">${summary(e)}</div>${e.note?`<div class="nt">📝 ${esc(e.note)}</div>`:''}</div>
        <div class="kc">${kcal(e)} kcal</div>${editable?`<div class="acts"><button class="ib" data-act="editEntry" data-id="${e.id}" aria-label="编辑">${UI_IC.edit}</button><button class="ib del" data-act="delEntry" data-id="${e.id}" aria-label="删除">${UI_IC.del}</button></div>`:''}</div>`;
    }
    h+=`</div>`;
  }
  return h;
}

/* ========== 渲染：历史 ========== */
function renderHistory(){
  const y=ui.calY,m=ui.calM,first=new Date(y,m,1),off=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),tk=todayKey();
  const top=topPart(lastNKeys(30)),wk=weekKeys().filter(isChecked).length;
  let h=`<div class="top"><div><div class="d1">训练日历</div><div class="d2">点日期查看当天详情</div></div><div class="pill">${UI_IC.flame}${streak()} 天</div></div>`;
  h+=`<div class="sg"><div class="sc"><div class="n">${streak()}<small>天</small></div><div class="l">连续打卡</div></div><div class="sc"><div class="n">${wk}<small>次</small></div><div class="l">本周训练</div></div><div class="sc"><div class="n" style="font-size:18px;line-height:1.55;color:${top?top.color:'var(--sub)'}">${top?top.name:'—'}</div><div class="l">最常练部位</div></div></div>`;
  h+=`<div class="card sec"><div class="cal-h"><button class="ib" data-act="calPrev" aria-label="上个月">${UI_IC.left}</button><div class="m">${y}年${m+1}月</div><button class="ib" data-act="calNext" aria-label="下个月">${UI_IC.right}</button></div><div class="cal-g">`;
  for(const w of ['一','二','三','四','五','六','日']) h+=`<div class="wd">${w}</div>`;
  for(let i=0;i<off;i++) h+=`<div class="day out"></div>`;
  for(let dd=1;dd<=days;dd++){
    const k=`${y}-${pad(m+1)}-${pad(dd)}`,d=S.days[k],ps=dayParts(d),chk=isChecked(k);
    const cls=['day'];if(chk)cls.push('chk');if(k===tk)cls.push('today');if(k===ui.sel)cls.push('sel');if(k>tk)cls.push('fut');
    const sty=chk&&ps.length?cv(ps[0]):chk?'--c:var(--ok);--t:rgba(34,176,125,.14)':'';
    h+=`<button class="${cls.join(' ')}" style="${sty}" data-act="pickDay" data-k="${k}">${dd}<span class="dots">${ps.slice(0,4).map(p=>`<i style="background:${p.color}"></i>`).join('')}</span></button>`;
  }
  h+=`</div><div class="legend">${PARTS.map(p=>`<span><i class="dot" style="background:${p.color}"></i>${p.name}</span>`).join('')}</div></div>`;
  const sd=S.days[ui.sel],sdt=pkey(ui.sel);
  h+=`<div class="sec"><div class="sec-h"><h2>${sdt.getMonth()+1}月${sdt.getDate()}日 星期${WD[sdt.getDay()]}</h2><span class="hint">${isChecked(ui.sel)?'✅ 已打卡':'未打卡'} · ${dayKcal(sd)} kcal</span></div>${entriesHTML(sd?sd.entries:[],false)}</div>`;
  $('#v-history').innerHTML=h;
}

/* ========== 渲染：统计 ========== */
function renderStats(){
  const all=Object.keys(S.days),checked=all.filter(isChecked);
  const mk=`${new Date().getFullYear()}-${pad(new Date().getMonth()+1)}`;
  const totalK=all.reduce((a,k)=>a+dayKcal(S.days[k]),0);
  let h=`<div class="top"><div><div class="d1">训练统计</div><div class="d2">坚持就是胜利</div></div></div>`;
  h+=`<div class="sg">
    <div class="sc"><div class="n">${streak()}<small>天</small></div><div class="l">连续打卡</div></div>
    <div class="sc"><div class="n">${longest()}<small>天</small></div><div class="l">最长连续</div></div>
    <div class="sc"><div class="n">${checked.length}<small>天</small></div><div class="l">累计打卡</div></div>
    <div class="sc"><div class="n">${weekKeys().filter(isChecked).length}<small>次</small></div><div class="l">本周训练</div></div>
    <div class="sc"><div class="n">${checked.filter(k=>k.startsWith(mk)).length}<small>次</small></div><div class="l">本月训练</div></div>
    <div class="sc"><div class="n">${totalK>=10000?(totalK/1000).toFixed(1)+'<small>k</small>':totalK}<small>kcal</small></div><div class="l">累计消耗(估)</div></div></div>`;
  const k30=lastNKeys(30),pc=partCounts(k30),top=topPart(k30),mx=Math.max(1,...Object.values(pc));
  h+=`<div class="card sec"><div class="sec-h" style="margin:0 0 6px"><h2>近 30 天部位分布</h2><span class="hint">按训练天数</span></div>`;
  if(top) h+=`<div class="hl" style="margin:6px 0 8px">${bodySVG(top)}<div><div style="font-size:13px;color:var(--sub)">最常练部位</div><div style="font-size:20px;font-weight:700;color:${top.color}">${top.name}</div><div style="font-size:13px;color:var(--sub)">练了 ${pc[top.id]} 天</div></div></div>`;
  for(const p of PARTS) h+=`<div class="hb"><span class="nm">${p.name}</span><span class="tr"><i style="width:${pc[p.id]/mx*100}%;background:${p.color}"></i></span><span class="v">${pc[p.id]} 天</span></div>`;
  h+=`</div>`;
  const k7=lastNKeys(7),kv=k7.map(k=>dayKcal(S.days[k])),m7=Math.max(1,...kv);
  h+=`<div class="card sec"><div class="sec-h" style="margin:0"><h2>近 7 天消耗</h2><span class="hint">kcal · 估算</span></div><div class="vb">`;
  k7.forEach((k,i)=>{const d=pkey(k);h+=`<div class="c"><span class="v">${kv[i]||''}</span><i style="height:${kv[i]/m7*85}%"></i><span class="d">${k===todayKey()?'今':WD[d.getDay()]}</span></div>`});
  h+=`</div></div>`;
  $('#v-stats').innerHTML=h;
}

/* ========== 渲染：我的 ========== */

    <div class="it"><div class="lb">活动水平<small>系数 ×${num(p.activity)}</small></div><select class="inp" style="width:170px" id="pf-activity" data-pfs="activity">${ACTIVITY.map(a=>`<option value="${a[0]}"${num(p.activity)===a[0]?' selected':''}>${a[1]}·${a[2]}</option>`).join('')}</select></div></div>
  <div class="card sec"><div class="sec-h" style="margin:0 0 8px"><h2>每日能量消耗</h2><span class="hint">估算</span></div>
    <div class="sg" style="grid-template-columns:1fr 1fr"><div class="sc" style="box-shadow:none;background:var(--card2)"><div class="n" id="bmr-v">${bmr(p)}<small>kcal</small></div><div class="l">基础代谢 BMR</div></div>
    <div class="sc" style="box-shadow:none;background:var(--card2)"><div class="n" id="tdee-v">${tdee(p)}<small>kcal</small></div><div class="l">每日总消耗 TDEE</div></div></div>
    <div class="note" style="margin-top:10px">BMR 采用 Mifflin-St Jeor 公式；TDEE = BMR × 活动系数（当前 ${num(p.activity)}）。训练消耗另见今日记录。</div></div>`;
  h+=`<div class="card sec set-list"><div class="sec-h" style="margin:0 0 2px"><h2>数据（备份/恢复）</h2></div>
    <div class="it"><div class="lb">导出备份<small>保存为 JSON 文件</small></div><button class="btn ghost" style="width:auto;padding:9px 16px" data-act="export">备份</button></div>
    <div class="it"><div class="lb">导入恢复<small>从 JSON 备份恢复（会覆盖当前数据）</small></div><button class="btn ghost" style="width:auto;padding:9px 16px" data-act="import">恢复</button></div>
    <div class="it"><div class="lb">清空所有数据<small>不可撤销，建议先备份</small></div><button class="btn danger" style="width:auto;padding:9px 6px" data-act="clear">清空</button></div></div>`;

function renderDiet(){
  const pr=S.profile,n=nutrition(pr),bmi=bmiOf(pr),act=ACTIVITY.find(a=>a[0]===num(pr.activity));
  const tk=dayKcal(getDay(todayKey()));
  const M=[['蛋白质','#FF6B6B',n.p],['脂肪','#F5A524',n.f],['碳水','#4C8DF6',n.c]];
  const R=50,C=2*Math.PI*R;let off=0,arcs='';
  for(const m of M){const len=m[2].k/n.target*C;arcs+=`<circle cx="66" cy="66" r="${R}" fill="none" stroke="${m[1]}" stroke-width="16" stroke-dasharray="${Math.max(0,len-2).toFixed(2)} ${(C-len+2).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;off+=len}
  let h=`<div class="top"><div><div class="d1">饮食</div><div class="d2">每日热量与三大营养素</div></div></div>`;
  h+=`<div class="card"><div class="sec-h" style="margin:0 0 10px"><h2>目标</h2><button class="hint" data-act="tab" data-tab="me" style="color:var(--accent);font-weight:600">修改资料</button></div>
    <div class="seg">${GOALS.map(g=>`<button class="${n.g===g[0]?'on':''}" data-act="goal" data-g="${g[0]}">${g[1]}</button>`).join('')}</div>

    <div class="note" style="margin-top:8px">${num(pr.height)} cm · ${num(pr.weight)} kg · ${num(pr.age)} 岁 · ${pr.sex==='female'?'女':'男'} · ${act?act[1]+' ×'+act[0]:''}　BMI 参考中国标准（≥24 超重），不区分肌肉量。</div></div>`;
  h+=`<div class="card sec"><div class="sec-h" style="margin:0 0 4px"><h2>每日热量目标</h2><span class="hint">估算</span></div>
    <div class="target"><div class="big" id="d-target">${n.target}<small>kcal</small></div>
    <div class="rg" id="d-range">${n.lo!==n.hi?`建议范围 ${n.lo}–${n.hi} kcal · `:''}${n.note}${n.g==='cut'?'（TDEE−500 至 −300，不低于基础代谢）':n.g==='bulk'?'（TDEE+250 至 +300）':'（= TDEE）'}</div></div>

  h+=`<div class="card sec"><div class="sec-h" style="margin:0 0 8px"><h2>三大营养素</h2><span class="hint">每日建议</span></div>
    <div class="macro"><div class="ring"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--card2)" stroke-width="16"/>${arcs}</svg><div class="ct"><b>${n.target}</b><span>kcal / 天</span></div></div>
    <div class="mlist">${M.map((m,i)=>`<div class="mrow"><div class="h"><span class="nm"><i class="dot" style="background:${m[1]}"></i>${m[0]}</span><span class="g" id="d-m${i}">${m[2].g}<small> g</small></span></div>
      <div class="sub">${m[2].k} kcal · ${m[2].pct}%</div><div class="bar"><i style="width:${m[2].pct}%;background:${m[1]}"></i></div></div>`).join('')}</div></div>

  const tips=[['🍗','#FF6B6B','每餐都有蛋白质','分 3–4 餐摄入，每餐约 '+Math.round(n.p.g/4)+'–'+Math.round(n.p.g/3)+' g'],

  const CF=[['米饭','1 碗 150 g ≈ 39 g 碳水'],['红薯','200 g ≈ 40 g'],['燕麦','40 g ≈ 24 g'],['全麦面包','2 片 ≈ 24 g'],['水果','1 个苹果 ≈ 25 g']];

    <div class="fh"><i class="dot" style="background:#FF6B6B"></i>优质蛋白</div><div class="foods">${PF.map(f=>`<span class="food">${f[0]}<small>${f[1]}</small></span>`).join('')}</div>

  h+=`<div class="disc">⚠️ 以上为估算，不是医疗建议。如有疾病、孕期或特殊情况，请咨询医生或注册营养师。</div>`;
  $('#v-diet').innerHTML=h;
}

function setTab(name){
  ui.tab=name;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+name));
  if(name==='history'){const n=new Date();ui.calY=n.getFullYear();ui.calM=n.getMonth();ui.sel=todayKey()}
  render();scrollTo(0,0);
}
function render(){({today:renderToday,diet:renderDiet,history:renderHistory,stats:renderStats,me:renderMe})[ui.tab]()}

function closeSheet(){$('#mask').classList.remove('on');$('#sheet').classList.remove('on');draft=null;sheetMode=null}

function openEditor(part,ex,entry){
  sheetMode='entry';
  if(entry) draft=JSON.parse(JSON.stringify(entry));
  else{
    // 预填：沿用该动作上一次的记录
    const last=findLast(part,ex.n);
    draft={id:null,part,name:ex.n,i:ex.i,m:ex.m,t:ex.t,sets:last&&last.sets?JSON.parse(JSON.stringify(last.sets)):ex.t==='h'?[{r:30,w:''},{r:30,w:''},{r:30,w:''}]:[{r:12,w:''},{r:12,w:''},{r:12,w:''}],
      minutes:last?last.minutes:30,km:last?last.km:'',note:''};
  }
  renderEditor();
}
function findLast(part,name){
  const ks=Object.keys(S.days).sort().reverse();
  for(const k of ks){const e=S.days[k].entries.find(x=>x.part===part&&x.name===name);if(e)return e}
  return null;
}
function renderEditor(){
  const p=PM[draft.part],d=draft;
  let h=`<div class="sh-h" style="${cv(p)}"><div class="ic">${ico(d.i)}</div><div><div class="t">${esc(d.name)}</div><div class="s">${p.name} · MET ${d.m}</div></div><button class="ib close" data-act="closeSheet" aria-label="关闭">${UI_IC.close}</button></div>`;
  if(d.t==='c'){
    h+=`<div class="fl"><div class="lb">时长<small>分钟</small></div><div class="stp"><button data-act="stepMin" data-d="-5">−</button><input id="ed-min" type="number" inputmode="numeric" min="0" value="${num(d.minutes)}"><button data-act="stepMin" data-d="5">+</button></div></div>
      <div class="fl"><div class="lb">距离<small>km，可选</small></div><input class="inp" id="ed-km" type="number" inputmode="decimal" step="0.1" min="0" style="width:132px" placeholder="—" value="${d.km??''}"></div>`;
  }else{
    h+=`<div class="fl"><div class="lb">组数</div><div class="stp"><button data-act="setCount" data-d="-1">−</button><input id="ed-count" type="number" readonly value="${d.sets.length}"><button data-act="setCount" data-d="1">+</button></div></div>
      <div class="sets-h"><span>组</span><span style="text-align:center">${d.t==='h'?'每组秒数':'每组次数'}</span><span style="text-align:center">重量 kg（可选）</span><span></span></div><div id="ed-sets">${setsHTML()}</div>
      <button class="addset" data-act="addSet">+ 添加一组</button>`;
  }
  h+=`<textarea id="ed-note" rows="2" maxlength="200" placeholder="备注（可选），如：状态不错，下次加重">${esc(d.note||'')}</textarea>`;
  h+=`<div class="est" id="ed-est"></div>`;
  h+=`<button class="btn" style="background:${p.color}" data-act="saveEntry">${d.id?'保存修改':'加入今日记录'}</button>`;
  openSheet(h);updEst();
}
function setsHTML(){
  const p=PM[draft.part];
  return draft.sets.map((s,i)=>`<div class="set" style="${cv(p)}"><span class="idx">${i+1}</span>
    <div class="stp"><button data-act="stepRep" data-i="${i}" data-d="${draft.t==='h'?-5:-1}">−</button><input type="number" inputmode="numeric" min="0" data-rep="${i}" value="${s.r}"><button data-act="stepRep" data-i="${i}" data-d="${draft.t==='h'?5:1}">+</button></div>
    <input class="inp" type="number" inputmode="decimal" step="0.5" min="0" placeholder="—" data-w="${i}" value="${s.w??''}">
    <button class="ib del" data-act="rmSet" data-i="${i}" aria-label="删除这一组">${UI_IC.del}</button></div>`).join('');
}
function refreshSets(){$('#ed-sets').innerHTML=setsHTML();$('#ed-count').value=draft.sets.length;updEst()}
function updEst(){
  const el=$('#ed-est');if(!el||!draft)return;
  const k=kcal({...draft,bw:draft.bw||S.profile.weight});
  el.innerHTML=`<span>预计消耗<br><small>估算 · 体重 ${draft.bw||S.profile.weight} kg</small></span><span><b>${k}</b> kcal</span>`;
}
function saveEntry(){
  const d=draft;
  if(d.t==='c'){if(num(d.minutes)<=0)return toast('请填写有氧时长');d.km=num(d.km)>0?num(d.km):''}
  else{
    d.sets=d.sets.filter(s=>num(s.r)>0).map(s=>({r:num(s.r),w:s.w===''||s.w==null||num(s.w)<=0?'':num(s.w)}));
    if(!d.sets.length){toast(d.t==='h'?'请至少填写一组秒数':'请至少填写一组次数');return}
  }
  d.note=(d.note||'').trim();
  const day=getDay(todayKey(),true);
  if(d.id){
    // 编辑：在其所在日期中查找
    for(const k in S.days){const i=S.days[k].entries.findIndex(e=>e.id===d.id);if(i>=0){S.days[k].entries[i]=d;break}}
    toast('已保存修改');
  }else{
    d.id=uid();d.bw=S.profile.weight;d.ts=Date.now();day.entries.push(d);
    toast(`已添加：${d.name}`);
  }
  save();closeSheet();render();
}

function openCustom(){
  sheetMode='custom';const p=PM[ui.part];
  openSheet(`<div class="sh-h" style="${cv(p)}"><div class="ic">${ico('custom')}</div><div><div class="t">添加自定义动作</div><div class="s">${p.name} · 保存后可重复使用</div></div><button class="ib close" data-act="closeSheet" aria-label="关闭">${UI_IC.close}</button></div>
    <div class="field"><label>动作名称</label><input class="inp" id="cu-name" maxlength="20" placeholder="${p.id==='cardio'?'例如：登山机':'例如：史密斯机卧推'}"></div>
    ${p.id==='cardio'?'':`<div class="field"><label>记录方式</label><div style="display:flex;gap:8px"><button class="btn ghost" data-act="cuType" data-t="r" id="cu-r" style="box-shadow:0 0 0 2px var(--accent) inset">按次数</button><button class="btn ghost" data-act="cuType" data-t="h" id="cu-h">按秒数（计时）</button></div></div>`}
    <button class="btn" style="background:${p.color};margin-top:16px" data-act="saveCustom">保存动作</button>`);
  draft={t:p.id==='cardio'?'c':'r'};
  setTimeout(()=>{const i=$('#cu-name');i&&i.focus()},300);
}
function saveCustom(){
  const n=($('#cu-name').value||'').trim();if(!n)return toast('请输入动作名称');
  const part=ui.part;
  if(exList(part).some(e=>e.n===n))return toast('该动作已存在');
  const t=draft.t;(S.custom[part]=S.custom[part]||[]).push({n,i:'custom',m:t==='c'?7:4.5,t});
  save();closeSheet();render();toast(`已添加自定义动作：${n}`);
}

/* ========== 打卡 ========== */
function checkin(){
  const k=todayKey(),d=getDay(k);
  if(isChecked(k))return toast('今天已经打过卡啦 💪');
  if(!d||!d.entries.length)return toast('先添加至少一个动作再打卡');
  d.checked=true;d.checkedAt=Date.now();save();render();
  toast(`打卡成功！已连续 ${streak()} 天 🎉`);
}

/* ========== 备份/恢复 ========== */
async function exportData(){
  const data=JSON.stringify({app:'fitness-log',version:1,exportedAt:new Date().toISOString(),...S},null,2);
  const name=`健身打卡备份-${todayKey()}.json`,blob=new Blob([data],{type:'application/json'});
  try{
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare){
      const f=new File([blob],name,{type:'application/json'});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'健身打卡备份'});return}
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('备份文件已导出');
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||typeof o!=='object'||typeof o.days!=='object')throw new Error('bad');
      if(!confirm('导入将覆盖当前所有数据，确定恢复吗？'))return;
      S=normalize(o);save();render();toast('数据已恢复');
    }catch(e){toast('导入失败：文件格式不正确')}
  };
  r.readAsText(file);
}

/* ========== 事件 ========== */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2000)}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  switch(a){
    case 'tab': ev.preventDefault();setTab(el.dataset.tab);break;
    case 'goal': S.profile.goal=el.dataset.g;save();renderDiet();toast('目标已切换为「'+GOALS.find(x=>x[0]===el.dataset.g)[1]+'」');break;
    case 'part':
      ui.part=ui.part===el.dataset.id?null:el.dataset.id;renderToday();
      if(ui.part){const s=$('#exSec');s&&s.scrollIntoView({behavior:'smooth',block:'nearest'})}break;
    case 'ex': openEditor(ui.part,exList(ui.part)[+el.dataset.i]);break;
    case 'delCustom':{
      ev.stopPropagation();const n=el.dataset.n;
      if(confirm(`删除自定义动作「${n}」？（已有记录不受影响）`)){S.custom[ui.part]=(S.custom[ui.part]||[]).filter(e=>e.n!==n);save();renderToday()}
      break;}
    case 'addCustom': openCustom();break;
    case 'cuType': draft.t=el.dataset.t;$('#cu-r').style.boxShadow=draft.t==='r'?'0 0 0 2px var(--accent) inset':'';$('#cu-h').style.boxShadow=draft.t==='h'?'0 0 0 2px var(--accent) inset':'';break;
    case 'saveCustom': saveCustom();break;
    case 'closeSheet': closeSheet();break;
    case 'setCount':{
      const dd=+el.dataset.d;
      if(dd>0){const l=draft.sets[draft.sets.length-1]||{r:draft.t==='h'?30:12,w:''};draft.sets.push({...l})}
      else if(draft.sets.length>1)draft.sets.pop();
      refreshSets();break;}
    case 'addSet':{const l=draft.sets[draft.sets.length-1]||{r:draft.t==='h'?30:12,w:''};draft.sets.push({...l});refreshSets();break}
    case 'rmSet': if(draft.sets.length>1){draft.sets.splice(+el.dataset.i,1);refreshSets()}else toast('至少保留一组');break;
    case 'stepRep':{const i=+el.dataset.i;draft.sets[i].r=Math.max(0,num(draft.sets[i].r)+(+el.dataset.d));const inp=document.querySelector(`[data-rep="${i}"]`);inp.value=draft.sets[i].r;updEst();break}
    case 'stepMin':{draft.minutes=Math.max(0,num(draft.minutes)+(+el.dataset.d));$('#ed-min').value=draft.minutes;updEst();break}
    case 'saveEntry': saveEntry();break;
    case 'editEntry':{const d=getDay(todayKey());const e=d&&d.entries.find(x=>x.id===el.dataset.id);if(e)openEditor(e.part,null,e);break}
    case 'delEntry':{
      const d=getDay(todayKey());const e=d&&d.entries.find(x=>x.id===el.dataset.id);
      if(e&&confirm(`删除「${e.name}」这条记录？`)){d.entries=d.entries.filter(x=>x!==e);if(!d.entries.length)d.checked=false;save();renderToday();toast('已删除')}
      break;}
    case 'checkin': checkin();break;
    case 'uncheck': if(confirm('撤销今天的打卡？')){const d=getDay(todayKey());if(d){d.checked=false;save();renderToday()}}break;
    case 'calPrev': if(--ui.calM<0){ui.calM=11;ui.calY--}renderHistory();break;
    case 'calNext': if(++ui.calM>11){ui.calM=0;ui.calY++}renderHistory();break;
    case 'pickDay': ui.sel=el.dataset.k;renderHistory();break;
    case 'export': exportData();break;
    case 'import': $('#importFile').value='';$('#importFile').click();break;
    case 'clear':
      if(confirm('确定清空所有数据？此操作不可撤销！')&&confirm('再次确认：真的要清空吗？')){S=normalize({profile:S.profile});save();ui.part=null;render();toast('已清空')}
      break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(!draft)return;
  if(t.dataset.rep!=null){draft.sets[+t.dataset.rep].r=t.value;updEst()}
  else if(t.dataset.w!=null){draft.sets[+t.dataset.w].w=t.value}
  else if(t.id==='ed-min'){draft.minutes=t.value;updEst()}
  else if(t.id==='ed-km'){draft.km=t.value}
  else if(t.id==='ed-note'){draft.note=t.value}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.pf){
    const f=t.dataset.pf,v=num(t.value),lim={weight:[30,250],height:[100,250],age:[10,100]}[f];
    if(v<lim[0]||v>lim[1]){toast('请输入合理的数值');t.value=S.profile[f]??'';return}
    S.profile[f]=v;save();renderMe();toast('已保存');
  }
  if(t.dataset.pfs){const f=t.dataset.pfs;S.profile[f]=f==='activity'?num(t.value):t.value;save();renderMe();toast('已保存')}
  if(t.id==='importFile'&&t.files&&t.files[0])importData(t.files[0]);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('on'))closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

render();

/* ========== PWA：离线缓存 ========== */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
